name: Refresh npm status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-npm-status.yml
      - scripts/**
      - profile/packages.json
      - profile/README.md
  pull_request:
    paths:
      - .github/workflows/refresh-npm-status.yml
      - scripts/**
      - profile/packages.json
      - profile/README.md

permissions:
  contents: read

concurrency:
  group: npm-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: node --test scripts/update-npm-status.test.mjs
